<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- `interactive-widget` keeps a soft keyboard, if one is ever
         summoned, from resizing the layout viewport out from under a
         canvas that is sized to it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b0e12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="mumuF1" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <!-- Installing the page is the only route to a chrome-free landscape
         app on an iPhone, which has no Fullscreen API at all. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <title>mumuF1 — F1 시뮬레이터</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <div id="status">loading…</div>
    <button type="button" id="btn-fullscreen" title="fullscreen">⛶</button>

    <div id="start-card" class="hidden">
      <h1><span>F1</span> mumu리그</h1>
      <span class="by">made by 불곰코끼리그리거</span>
      <div id="circuit-picker"></div>
      <button type="button" id="btn-start" class="cta">START</button>
      <small id="touch-hint">왼쪽 엄지 조향 · 오른쪽 엄지 위 스로틀 / 아래 브레이크</small>
      <!-- Shown instead of the control hint on iOS in a tab, where the
           fullscreen button cannot exist and this is the way to a full
           screen. `ui/viewport.ts` decides which of the two is up. -->
      <small id="install-hint" class="hidden">
        전체 화면으로 하려면 <b>공유 → 홈 화면에 추가</b>
      </small>
    </div>

    <div id="rotate-prompt" class="hidden">
      <div class="phone"></div>
      <b>기기를 가로로 돌려주세요</b>
    </div>

    <div id="touch-buttons">
      <button type="button" id="btn-camera">1인칭</button>
      <button type="button" id="btn-aero">AERO</button>
      <button type="button" id="btn-overtake">BOOST</button>
      <button type="button" id="btn-pit">PIT</button>
      <!-- A real physics car can end up on its roof, or off the map
           entirely. Keyboard already had R; on a phone there was no way
           back at all, and no way to tell that one existed. -->
      <button type="button" id="btn-reset">RESET</button>
    </div>
    <div id="help">
      <kbd>W</kbd>/<kbd>↑</kbd> throttle · <kbd>S</kbd>/<kbd>↓</kbd> brake ·
      <kbd>A</kbd><kbd>D</kbd> steer · <kbd>S</kbd> hold to reverse ·
      <kbd>F</kbd> straight mode · <kbd>Shift</kbd> overtake ·
      <kbd>C</kbd> camera · <kbd>P</kbd> pit · <kbd>R</kbd> reset
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
