# Check every change, and publish the ones that pass.
#
# There are two halves to this repository and they are checked in two
# different ways, for one reason: half of the game has no `UnityEngine`
# in it and half of it is nothing but.
#
# The half without — tyres, aerodynamics, suspension, the drivetrain,
# circuit geometry, the racing line, the speed profile, timing, sessions,
# the AI driver, ghosts, the field — is `unity/Packages/com.mumu.f1core`,
# and a plain .NET SDK compiles and tests it in twenty seconds with no
# editor and no licence. That is this file.
#
# The half with — `Assets/Scripts`, the shader, the HUD — needs the
# editor, and so does anything that produces a player. That is
# `unity.yml`.
#
# `deploy` needs `core`. A red build is a build that does not go out,
# which is the only reason this file is worth having.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a deploy can be re-run by hand without an empty commit.
  workflow_dispatch:

# One at a time. Two pushes in quick succession would otherwise race to
# publish, and the loser could be the newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test the simulation
        run: dotnet test dotnet/MumuF1.Core.Tests --nologo --verbosity normal

      # Two small Node scripts assemble the site and install model kits.
      # They run on hosts nobody is watching, which is where a typo costs
      # the most.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the tooling
        run: npm ci

      - name: Lint
        run: npm run lint

  # The site, which is the Unity player and nothing else.
  #
  # It cannot be built here — the editor is several gigabytes and needs a
  # licence — so `unity.yml` builds it on a runner that has one and
  # publishes it as a release asset. This fetches that.
  #
  # Which means this job depends on a build having been published at all,
  # and says so plainly rather than deploying an empty directory.
  site:
    needs: core
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the player and lay out the site
        run: node tools/build-site.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

      - id: deployment
        uses: actions/deploy-pages@v4
