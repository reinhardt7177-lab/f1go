# Check every change, and publish the ones that pass.
#
# The repository had no automation at all: `main` was whatever was last
# pushed to it, and the deployed site was whatever `main` happened to
# be. Nothing stood between a commit that did not compile and the URL
# people play on.
#
# So `deploy` needs `check`. A red build is a build that does not go
# out, which is the only reason this file is worth having.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a deploy can be re-run by hand without an empty commit.
  workflow_dispatch:

# One at a time. Two pushes in quick succession would otherwise race to
# publish, and the loser could be the newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 wants 22.12 or newer; this is what the project is
          # developed against.
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            f1sim/package-lock.json

      - name: Install the game
        working-directory: f1sim
        run: npm ci

      # The linter lives at the root with its own TypeScript — see the
      # header of `eslint.config.js` for why it cannot share the game's.
      - name: Install the tooling
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        working-directory: f1sim
        run: npm run typecheck

      - name: Tests
        working-directory: f1sim
        run: npm run test

      # The same two commands the host runs, in the same order, so a
      # build that only breaks when the site is assembled breaks here
      # rather than on the way to production.
      - name: Build the site
        run: npm --prefix f1sim run build && node tools/build-site.js

      - name: Check the build produced something to serve
        run: |
          test -f dist-site/index.html
          test -f dist-site/manifest.webmanifest
          test -d dist-site/assets
          echo "dist-site: $(du -sh dist-site | cut -f1), $(find dist-site -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v3
        # Only what is going to be published needs uploading.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-site

  # The Unity port's simulation half, compiled and tested without Unity.
  #
  # This job is the answer to a real problem: the port is being written
  # on a machine with no editor, no .NET and no way to install either, so
  # nothing about it can be checked where it is written. It can be
  # checked here. The simulation has no `UnityEngine` in it by design, so
  # a plain SDK compiles it and runs the ported tests — no editor, no
  # licence, twenty seconds.
  #
  # What this does NOT cover is everything that touches the engine: the
  # MonoBehaviour glue, the scene, shaders, input. That half needs the
  # editor, and a licence to build here.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test the ported simulation
        run: dotnet test dotnet/MumuF1.Core.Tests --nologo --verbosity normal

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
