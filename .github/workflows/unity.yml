# Build the Unity project, and run the half CI cannot otherwise reach.
#
# `ci.yml` already compiles and tests the simulation, because that half
# has no `UnityEngine` in it and a plain .NET SDK will take it. What it
# cannot touch is everything that does: `Assets/Scripts`, the shader,
# the bootstrap, the scene-less startup. Those need the editor, and the
# editor needs a licence.
#
# So this workflow is deliberately dormant until one is provided. Every
# job checks for the licence first and skips quietly without it, which
# means the repository stays green for anyone who clones it and does not
# have a Unity account — rather than showing a permanently red X for a
# thing that is not broken.
#
# To turn it on, add these three repository secrets under
# Settings → Secrets and variables → Actions:
#
#   UNITY_LICENSE    the full contents of your Unity_lic.ulf
#   UNITY_EMAIL      the address on the Unity account
#   UNITY_PASSWORD   its password
#
# All three, even for a personal licence. This was got wrong once here,
# on the reasoning that a licence file ought to be self-contained — it is
# not. GameCI signs in with the account and then presents the file, and
# with only the file it stops before it starts:
#
#     No valid license activation strategy could be determined.
#     Make sure to provide UNITY_EMAIL, UNITY_PASSWORD, and either a
#     UNITY_SERIAL or UNITY_LICENSE.
#
# A personal licence is free. On Windows the file is usually already at
#
#     C:\ProgramData\Unity\Unity_lic.ulf
#
# and on macOS at `/Library/Application Support/Unity/Unity_lic.ulf`.
# Open it in a text editor, copy the whole thing, paste. If it is not
# there, the editor will make one: Help → Manage License → Manual
# activation → Save License Request, then upload that `.alf` at
# https://license.unity3d.com/manual and paste the `.ulf` it returns.
#
# The jobs below wait for all three rather than for the licence alone, so
# a half-finished setup skips quietly instead of failing. A red X for a
# missing password reads as a broken build, and it is not one.

name: Unity

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'unity/**'
      - '.github/workflows/unity.yml'
  workflow_dispatch:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  # Compile Assets/Scripts against a real UnityEngine.
  #
  # This is the more valuable of the two jobs, and not by a little. The
  # simulation is already proven by `ci.yml`; what is unproven is whether
  # `Assets/Scripts` even compiles — `TrackBuilder`, `CarView`,
  # `TracksideBuilder`, `CarController` and the toon shader have never
  # been through a compiler that knows what `UnityEngine` is.
  #
  # It was the test runner and is now a plain build, which is still the
  # right shape: a build for the platform the runner already is asks the
  # least of the machine — no WebAssembly, no graphics — so whatever is
  # wrong surfaces soonest.
  #
  # The step after it prints the editor's log whatever happens, and that
  # is the part that earned its place. Several runs were spent guessing
  # at a silence that was not silence: licence activation was failing and
  # retrying five times at four-minute intervals, and nothing said so
  # until this step existed to print it.
  editor:
    name: Compile Assets against UnityEngine
    runs-on: ubuntu-latest
    # A hung editor does not fail, it waits — and the default is six hours
    # of a runner held by a process nobody can see. Forty-five minutes is
    # comfortably past a cold import and nowhere near a working day.
    timeout-minutes: 30
    steps:
      - name: Is the licence set up?
        id: licence
        run: |
          echo "have=${{ env.UNITY_LICENSE != '' && env.UNITY_EMAIL != '' && env.UNITY_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.licence.outputs.have == 'false'
        run: |
          echo "Unity activation needs all three of UNITY_LICENSE, UNITY_EMAIL"
          echo "and UNITY_PASSWORD. Set:"
          echo "  UNITY_LICENSE  ${{ env.UNITY_LICENSE != '' && 'yes' || 'NO' }}"
          echo "  UNITY_EMAIL    ${{ env.UNITY_EMAIL != '' && 'yes' || 'NO' }}"
          echo "  UNITY_PASSWORD ${{ env.UNITY_PASSWORD != '' && 'yes' || 'NO' }}"
          echo "See the header of .github/workflows/unity.yml."

      - if: steps.licence.outputs.have == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true

      # The import is the slow part — twenty minutes cold, under two warm
      # — so the imported Library is cached on the hash of everything that
      # can change what it contains.
      - if: steps.licence.outputs.have == 'true'
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-WebGL-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - if: steps.licence.outputs.have == 'true'
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity
          unityVersion: auto
          # Linux rather than WebGL, and that is the whole point of this
          # job: a Linux player build compiles every script without
          # spending twenty minutes translating the engine to
          # WebAssembly. If the C# is wrong it is wrong here, sooner and
          # more legibly.
          targetPlatform: StandaloneLinux64
          buildName: compilecheck
          customParameters: -accept-apiupdate -nographics

      # Whatever the editor said, in the place it says it. GameCI prints
      # a summary and swallows the rest; the compile errors are in the
      # log file, and a hang leaves one too.
      - if: always() && steps.licence.outputs.have == 'true'
        name: What the editor said
        run: |
          for log in build/*.log unity/*.log /github/workspace/*.log ~/.config/unity3d/Editor.log; do
            [ -f "$log" ] || continue
            echo "===== $log ====="
            grep -nE "error CS|Compilation failed|Shader error|error:|Aborting|Fatal" "$log" | head -60 \
              || tail -80 "$log"
          done
          echo "===== end ====="

  # The playable build.
  #
  # WebGL because that is what the web version already is: the point of
  # the port was never to leave the browser, it was to get a real
  # renderer and a real physics engine underneath it.
  webgl:
    name: Build for WebGL
    needs: editor
    runs-on: ubuntu-latest
    # Longer than the editor job: this one imports and then builds, and a
    # first WebGL build compiles the whole engine to WebAssembly.
    timeout-minutes: 75
    steps:
      - name: Is the licence set up?
        id: licence
        run: |
          echo "have=${{ env.UNITY_LICENSE != '' && env.UNITY_EMAIL != '' && env.UNITY_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.licence.outputs.have == 'false'
        run: echo "Unity activation is not fully set up, so there is nothing to build here."

      - if: steps.licence.outputs.have == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true

      - if: steps.licence.outputs.have == 'true'
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-WebGL-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - if: steps.licence.outputs.have == 'true'
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity
          unityVersion: auto
          targetPlatform: WebGL
          buildName: mumuF1
          customParameters: -accept-apiupdate

      - if: steps.licence.outputs.have == 'true'
        name: Say how big it came out
        run: |
          du -sh build/WebGL || true
          find build -maxdepth 3 -type f -printf '%10s  %p\n' | sort -rn | head -12 || true

      # Uploaded rather than published. Publishing needs a decision about
      # where it goes — the Pages site is the web version's, and putting a
      # second game on it is a change to `ci.yml` rather than a step here.
      # An artifact is downloadable and playable now, and does not risk the
      # deploy that already works.
      - if: steps.licence.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mumuF1-webgl
          path: build/WebGL
          retention-days: 14
